<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Paths are relative so Vite's base ('/sed/') prepends correctly in both
         dev and prod. Absolute '/sed/...' here causes Vite dev to double-prefix
         to '/sed/sed/...' (Chrome then logs a manifest parse error). -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SED" />
    <title>SED Dashboard — Anchor Falls</title>
    <!-- WP18 no-flash theme (This device's Appearance setting, WP7):
         applies the SAME resolution `src/lib/device-theme.ts`'s
         `resolveDeviceTheme(stored, orgDefault)` does, before first paint —
         this can't import that module (it must run before any script
         bundle), so the rule and both storage keys
         (`DEVICE_THEME_STORAGE_KEY`, `ORG_THEME_CACHE_KEY`) are duplicated
         here; `index.no-flash-theme.test.mjs` asserts all of this never
         drifts from device-theme.ts.
           1. This device's own saved choice ('sed-device-theme') wins, exactly
              like resolveDeviceTheme.
           2. Otherwise, the org default ('config/appSettings', via
              `settings.theme`) would decide — but that needs a Firestore read
              and genuinely isn't knowable synchronously pre-paint on a FIRST
              visit. `useDeviceTheme` mirrors the last org default it actually
              loaded into 'sed-org-theme-cache' (review fix), so from a
              device's SECOND visit onward this script can use that
              best-effort snapshot instead of always assuming light.
           3. Otherwise (truly first visit, nothing cached anywhere): default
              (light), same as resolveDeviceTheme(null, undefined).
         No CSP exists in this app (checked firebase.json /
         firebase.staging.json / public headers), so an inline script is
         safe here. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('sed-device-theme');
          var theme;
          if (stored === 'dark' || stored === 'default') {
            theme = stored;
          } else {
            var orgDefault = window.localStorage.getItem('sed-org-theme-cache');
            theme = orgDefault === 'dark' ? 'dark' : 'default';
          }
          if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          // Private browsing / blocked storage: fall through to light, same
          // as a first-ever visit on this device.
        }
      })();
    </script>
    <!-- GitHub Pages SPA redirect: restore the path encoded by the root 404.html in the
         public Pages repository (see docs/source-and-web-deployment.md, Deep links). -->
    <script>
      (function(l) {
        if (l.search[1] === 'p') {
          var parts = l.search.slice(1).split('&').map(function(s) { return s.replace(/~and~/g, '&'); });
          var path = parts[0].slice(2);
          var query = parts[1] ? '?' + parts[1].slice(2) : '';
          window.history.replaceState(null, null, l.pathname.replace(/\/$/, '') + path + query + l.hash);
        }
      }(window.location));
    </script>
    <script type="module" crossorigin src="/sed/assets/main-Bnjf3uZI.js"></script>
    <link rel="stylesheet" crossorigin href="/sed/assets/main-CTjv6fjM.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
